[project]
name = "snowflake-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for the Snowflake chatbot proof of concept."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Stratton Carroll" }
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "openai>=1.34.0",
  "mcp>=1.18.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "black>=24.4.0",
  "mypy>=1.10.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
